<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Mini 4WD Track A</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #4a4c50; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      // 有 ?view= 時是截圖頁（scripts/render.mjs）；沒有時（例如 pnpm run dev 開首頁）導向換件車庫，保留其他查詢參數
      if (new URLSearchParams(location.search).has('view')) {
        import('./main.js');
      } else {
        location.replace(`./garage.html${location.search}`);
      }
    </script>
  </body>
</html>
